    member:
      name: Collaborator
      about: Works on the project, sees their own tasks and their own clock.
    manager:
      name: Project manager
      about: Runs the project, its teams, its people, its labels and its integrations.
    finance:
      name: Finance
      about: "Runs the project's money: hourly rates, customer and billing."
    admin:
      name: Project administrator
      about: Everything that can be done in this project.
