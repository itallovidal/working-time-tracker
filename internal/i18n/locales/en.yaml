permissions:
  keys:
    project_edit:
      name: Edit the project
      about: Name, description, sprint, daily, weekly and the customer meeting, and deleting the project.
    teams_manage:
      name: Manage teams
      about: Create, edit and delete teams and choose who is in each one.
    collaborators_manage:
      name: Add and remove people
      about: Add collaborators, remove them from the project and choose each one's group.
    rates_view:
      name: See colleagues' rates
      about: The hourly rate each person earns and everyone's hours.
    rates_manage:
      name: Set hourly rates
      about: How much each person earns per hour in this project.
    billing_view:
      name: See the billing
      about: The customer, the billed rate and the Overview, with revenue, cost and margin.
    billing_manage:
      name: Set the customer and the billed rate
      about: Change the project's customer and what they pay per hour.
    labels_manage:
      name: Manage labels
      about: Create, rename and delete the project's labels.
    integrations_manage:
      name: Manage integrations
      about: Connect GitHub, GitLab and Trello, and change or delete the connections.
    projects_create:
      name: Create projects
      about: Create new projects in the organization.
    customers_manage:
      name: Manage customers
      about: Register, change and delete the organization's customers.
    people_manage:
      name: Manage people
      about: Invite people, revoke invites and set the weekly hours.
  presets:
    member:
      name: Collaborator
      about: Works on the project, sees their own tasks and their own clock.
    manager:
      name: Project manager
      about: Runs the project, its teams, its people, its labels and its integrations.
    finance:
      name: Finance
      about: "Runs the project's money: hourly rates, customer and billing."
    admin:
      name: Project administrator
      about: Everything that can be done in this project.
    custom:
      name: Custom
      about: A mix of permissions that matches no group.
  has: "{{.count}} permissions"

