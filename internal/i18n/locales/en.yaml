integration_types:
  github:
    about: Issues of a repository
    token_hint: Personal token with permission to read issues.
    item_label: Issue number
    item_placeholder: "E.g.: 42"
    pick_title: Pick the repository
    pick_hint: The list shows the repositories your account can see. If a repository of an organization does not show up, the organization owner must approve the app in the organization settings, under third-party application access.
    sync_label: "Sync the issues of this repository with the tasks"
    sync_hint: "Open issues become tasks, and the name, description, labels, assignee and closing stay the same on both sides, whichever one changes. The assignee is linked by the user's public email on GitHub. If both sides change the same field, GitHub wins. Priority, deadline, hours and the In progress and Awaiting closure statuses stay here only."
    connect_unconfigured: The GitHub connection is not set up on this server. Whoever runs it must define GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET and PUBLIC_URL.
    fields:
      repo:
        label: Repository
        placeholder: owner/repository
        hint: The repository address is accepted too.
  gitlab:
    about: Issues of a project
    token_hint: Token with the read_api scope.
    item_label: Issue number
    item_placeholder: "E.g.: 42"
    fields:
      project_url:
        label: Project
        placeholder: group/project
        hint: The project address on gitlab.com is accepted too.
  trello:
    about: Cards of a board
    token_hint: Token of the Trello API, generated from the key, with read and write permission.
    item_label: Card
    item_placeholder: "Short link, e.g.: H0TZyzbK"
    pick_title: Pick the board
    pick_hint: The list shows the open boards your Trello account can see, with their workspace.
    sync_label: "Sync the cards of this board with the tasks"
    sync_hint: "Every card of the board becomes a task, and the name, description, labels and due date stay the same on both sides, whichever one changes. An archived card, or one with its due date marked done, closes the task, and closing a task archives the card. If both sides change the same field, Trello wins. The lists, the assignee, priority, hours and the In progress and Awaiting closure statuses stay out of the sync."
    connect_unconfigured: The Trello connection is not set up on this server. Whoever runs it must define TRELLO_API_KEY and PUBLIC_URL.
    fields:
      api_key:
        label: API key
        hint: The key of the Trello app, set by the connection.
      board_id:
        label: Board
        placeholder: https://trello.com/b/AbC123xy/name
        hint: The board address, the short link or the id.
      board_name:
        label: Board name

