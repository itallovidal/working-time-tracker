integration_types:
  github:
    about: Issues de um repositório
    token_hint: Token pessoal com permissão de leitura de issues.
    item_label: Número da issue
    item_placeholder: "Ex.: 42"
    pick_title: Escolha o repositório
    pick_hint: A lista traz os repositórios que a sua conta enxerga. Se um repositório de uma organização não aparecer, o dono da organização precisa aprovar o app nas configurações dela, em acesso de aplicativos de terceiros.
    sync_label: "Sincronizar as issues deste repositório com as tarefas"
    sync_hint: "As issues abertas viram tarefas, e o nome, a descrição, as etiquetas, o responsável e o fechamento ficam iguais nos dois lados, para qualquer lado que mude. O responsável é ligado pelo e-mail público do usuário no GitHub. Se os dois lados mudarem o mesmo campo, vale o do GitHub. Prioridade, prazo, horas e os status Em progresso e Aguardando fechamento ficam só aqui."
    connect_unconfigured: A conexão com o GitHub não está configurada neste servidor. Quem administra precisa definir GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET e PUBLIC_URL.
    fields:
      repo:
        label: Repositório
        placeholder: dono/repositorio
        hint: Aceita também o endereço do repositório.
  gitlab:
    about: Issues de um projeto
    token_hint: Token com escopo read_api.
    item_label: Número da issue
    item_placeholder: "Ex.: 42"
    fields:
      project_url:
        label: Projeto
        placeholder: grupo/projeto
        hint: Aceita também o endereço do projeto no gitlab.com.
  trello:
    about: Cartões de um quadro
    token_hint: Token da API do Trello, gerado a partir da chave, com permissão de leitura e escrita.
    item_label: Cartão
    item_placeholder: "Link curto, ex.: H0TZyzbK"
    pick_title: Escolha o quadro
    pick_hint: A lista traz os quadros abertos que a sua conta do Trello enxerga, com o espaço de trabalho de cada um.
    sync_label: "Sincronizar os cartões deste quadro com as tarefas"
    sync_hint: "Cada cartão do quadro vira uma tarefa, e o nome, a descrição, as etiquetas e a data de entrega ficam iguais nos dois lados, para qualquer lado que mude. O cartão arquivado, ou com a data de entrega marcada como concluída, fecha a tarefa, e fechar a tarefa arquiva o cartão. Se os dois lados mudarem o mesmo campo, vale o do Trello. As listas, o responsável, a prioridade, as horas e os status Em progresso e Aguardando fechamento ficam fora da sincronização."
    connect_unconfigured: A conexão com o Trello não está configurada neste servidor. Quem administra precisa definir TRELLO_API_KEY e PUBLIC_URL.
    fields:
      api_key:
        label: Chave da API
        hint: A chave do app do Trello, definida pela conexão.
      board_id:
        label: Quadro
        placeholder: https://trello.com/b/AbC123xy/nome
        hint: O endereço do quadro, o link curto ou o id.
      board_name:
        label: Nome do quadro

