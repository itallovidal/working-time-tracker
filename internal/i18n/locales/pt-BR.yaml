      name: Criar projetos
      about: Criar projetos novos na organização.
    customers_manage:
      name: Cuidar dos clientes
      about: Cadastrar, alterar e excluir os clientes da organização.
    people_manage:
      name: Cuidar das pessoas
      about: Convidar pessoas, revogar convites e definir a jornada semanal.
