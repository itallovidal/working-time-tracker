integration_types:
  github:
    about: Issues de um repositório
    token_hint: Token pessoal com permissão de leitura de issues.
    item_label: Número da issue
    item_placeholder: "Ex.: 42"
    fields:
      repo:
        label: Repositório
        placeholder: dono/repositorio
        hint: Aceita também o endereço do repositório.
  gitlab:
    about: Issues de um projeto
    token_hint: Token com escopo read_api.
    item_label: Número da issue
    item_placeholder: "Ex.: 42"
    fields:
      project_url:
        label: Projeto
        placeholder: grupo/projeto
        hint: Aceita também o endereço do projeto no gitlab.com.
  trello:
    about: Cartões de um quadro
    token_hint: Token da API gerado a partir da chave, com permissão de leitura.
    item_label: Cartão
    item_placeholder: "Link curto, ex.: H0TZyzbK"
    fields:
      api_key:
        label: Chave da API
        hint: A chave do seu Power-Up, em trello.com/apps/admin.
      board_id:
        label: Quadro
        placeholder: https://trello.com/b/AbC123xy/nome
        hint: O endereço do quadro, o link curto ou o id.

