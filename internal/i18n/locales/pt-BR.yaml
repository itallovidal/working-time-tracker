# Textos da interface em português do Brasil (idioma padrão).
#
# Regras (valem para todos os idiomas, ver README):
#   - uma chave por frase inteira; nada de montar frase juntando pedaços;
#   - valores entram por placeholder: "{{.name}}";
#   - plural com as formas one/other, e o placeholder {{.count}};
#   - o mesmo conjunto de chaves e de placeholders em todos os idiomas
#     (um teste confere);
#   - não use como nome de chave: id, description, hash, leftdelim, rightdelim,
#     zero, one, two, few, many, other, translation. O go-i18n os trata como
#     partes de uma mensagem e recusa o arquivo (use, por exemplo, description_label).

