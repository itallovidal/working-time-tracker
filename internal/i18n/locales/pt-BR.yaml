      name: Cuidar das etiquetas
      about: Criar, renomear e excluir as etiquetas do projeto.
    integrations_manage:
      name: Cuidar das integrações
      about: Conectar o GitHub, o GitLab e o Trello, e alterar ou excluir as conexões.
