      name: Pôr e tirar pessoas do projeto
      about: Adicionar colaboradores, tirá-los do projeto e escolher o grupo de cada um.
    rates_view:
      name: Ver o valor dos colegas
      about: O valor por hora que cada um recebe e as horas de todos.
