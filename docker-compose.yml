services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wtt
      POSTGRES_PASSWORD: wtt
      POSTGRES_DB: working_time_tracker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Cria também o banco usado pelos testes (TEST_DATABASE_URL).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtt -d working_time_tracker"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
